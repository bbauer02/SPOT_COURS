<svg xmlns="http://www.w3.org/2000/svg" width="800" height="310" viewBox="0 0 800 310" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <rect x="0" y="0" width="800" height="310" fill="#ffffff"/>

  <!-- Poste du développeur -->
  <rect x="10" y="105" width="140" height="80" rx="8" fill="#eef4fb" stroke="#3b6ea5" stroke-width="1.5"/>
  <text x="80" y="135" text-anchor="middle" font-weight="bold">Poste / VM</text>
  <text x="80" y="152" text-anchor="middle">du développeur</text>
  <text x="80" y="170" text-anchor="middle" fill="#555555">git commit</text>

  <!-- GitHub -->
  <rect x="195" y="105" width="140" height="80" rx="8" fill="#f3f3f3" stroke="#333333" stroke-width="1.5"/>
  <text x="265" y="135" text-anchor="middle" font-weight="bold">GitHub</text>
  <text x="265" y="152" text-anchor="middle">dépôt</text>
  <text x="265" y="169" text-anchor="middle">jenkins-calculatrice</text>

  <!-- Instance EC2 -->
  <rect x="380" y="10" width="410" height="290" rx="10" fill="#fff8ec" stroke="#d98b1f" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="585" y="30" text-anchor="middle" font-weight="bold" fill="#a3620a">Instance AWS EC2 (Ubuntu + Docker Engine)</text>

  <!-- Conteneur Jenkins -->
  <rect x="400" y="50" width="170" height="95" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="485" y="78" text-anchor="middle" font-weight="bold">Conteneur jenkins</text>
  <text x="485" y="96" text-anchor="middle">port 8080 (web)</text>
  <text x="485" y="113" text-anchor="middle">client docker +</text>
  <text x="485" y="129" text-anchor="middle">docker compose</text>

  <!-- Démon Docker -->
  <rect x="610" y="50" width="165" height="95" rx="8" fill="#e8f4fd" stroke="#1d63ed" stroke-width="1.5"/>
  <text x="692" y="80" text-anchor="middle" font-weight="bold">Démon Docker</text>
  <text x="692" y="98" text-anchor="middle">(dockerd de l'hôte)</text>
  <text x="692" y="118" text-anchor="middle" fill="#555555">/var/run/docker.sock</text>

  <!-- Conteneur application -->
  <rect x="400" y="200" width="375" height="80" rx="8" fill="#eaf7ea" stroke="#2e8b57" stroke-width="1.5"/>
  <text x="587" y="232" text-anchor="middle" font-weight="bold">Conteneur calculatrice-app</text>
  <text x="587" y="252" text-anchor="middle">Node.js / Express, port 3000</text>

  <!-- 1. git push -->
  <line x1="150" y1="145" x2="187" y2="145" stroke="#333333" stroke-width="1.8"/>
  <polygon points="195,145 185,140 185,150" fill="#333333"/>
  <text x="172" y="97" text-anchor="middle" font-weight="bold" fill="#3b6ea5">1</text>
  <text x="172" y="112" text-anchor="middle" font-size="10">git push</text>

  <!-- 2. webhook -->
  <line x1="335" y1="120" x2="392" y2="92" stroke="#333333" stroke-width="1.8"/>
  <polygon points="400,88 388,87 393,97" fill="#333333"/>
  <text x="352" y="70" text-anchor="middle" font-weight="bold" fill="#3b6ea5">2</text>
  <text x="352" y="85" text-anchor="middle" font-size="10">webhook</text>

  <!-- 3. clone -->
  <line x1="400" y1="130" x2="343" y2="160" stroke="#333333" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="335,164 346,154 348,164" fill="#333333"/>
  <text x="357" y="185" text-anchor="middle" font-weight="bold" fill="#3b6ea5">3</text>
  <text x="357" y="200" text-anchor="middle" font-size="10">git clone</text>
  <text x="357" y="212" text-anchor="middle" font-size="10">(GitHub App)</text>

  <!-- 4. docker compose -->
  <line x1="570" y1="97" x2="602" y2="97" stroke="#333333" stroke-width="1.8"/>
  <polygon points="610,97 600,92 600,102" fill="#333333"/>
  <text x="590" y="160" text-anchor="middle" font-weight="bold" fill="#3b6ea5">4</text>
  <text x="590" y="175" text-anchor="middle" font-size="10">build + up</text>

  <!-- dockerd crée le conteneur -->
  <line x1="692" y1="145" x2="692" y2="192" stroke="#333333" stroke-width="1.8"/>
  <polygon points="692,200 687,190 697,190" fill="#333333"/>

  <!-- 5. test -->
  <line x1="470" y1="145" x2="470" y2="192" stroke="#2e8b57" stroke-width="1.8"/>
  <polygon points="470,200 465,190 475,190" fill="#2e8b57"/>
  <text x="440" y="168" text-anchor="middle" font-weight="bold" fill="#3b6ea5">5</text>
  <text x="440" y="183" text-anchor="middle" font-size="10">curl :3000</text>
</svg>
